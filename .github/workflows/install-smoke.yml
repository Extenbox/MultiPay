name: Install smoke test

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/install-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none

      - name: Test install from GitHub dev-master
        run: |
          mkdir /tmp/smoke && cd /tmp/smoke
          composer init --name=smoke/test --no-interaction
          composer config repositories.multipay vcs https://github.com/Extenbox/MultiPay
          composer require extenbox/multipay:dev-master --no-interaction
          php -r "require 'vendor/autoload.php'; new Extenbox\Multipay\Payment(['default'=>'local','drivers'=>['local'=>['callbackUrl'=>'http://localhost/cb','title'=>'t','description'=>'d']],'map'=>['local'=>Extenbox\Multipay\Drivers\Local\Local::class]]); echo \"OK\n\";"